name: Intraday Stock Screener

on:
  schedule:
    # Every 15 minutes, 6:30am-1:00pm PDT (summer), Monday-Friday.
    # GitHub cron is always UTC and does not shift for daylight saving,
    # so this window becomes 5:30am-12:00pm during PST (winter).
    # Shift every hour value below by -1 in winter if you want it exact.
    - cron: "30,45 13 * * 1-5"        # 13:30, 13:45 UTC
    - cron: "0,15,30,45 14-19 * * 1-5" # 14:00 through 19:45 UTC, every 15 min
    - cron: "0 20 * * 1-5"             # 20:00 UTC (1:00pm PDT)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python screener.py

      - name: Commit and push results
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@github.com"
          git add results.json notified.json
          git diff --quiet --cached || git commit -m "Update results $(date -u +%Y-%m-%dT%H:%M)"
          git push
