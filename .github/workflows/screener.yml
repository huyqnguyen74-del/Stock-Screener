name: Daily Stock Screener

on:
  schedule:
    # 13:30 UTC = 6:30am PDT (summer) / 5:30am PST (winter).
    # GitHub cron is always UTC and does not adjust for daylight saving.
    # Shift this by 1 hour twice a year if you want it exact year-round.
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit and push results
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@github.com"
          git add results.json
          git diff --quiet --cached || git commit -m "Update results $(date -u +%Y-%m-%d)"
          git push
